<body>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBbpP6uttRj_7LozBvtPRw7QtHzBfr72CU",
            authDomain: "nolxpages.firebaseapp.com",
            projectId: "nolxpages",
            storageBucket: "nolxpages.firebasestorage.app",
            messagingSenderId: "672585065953",
            appId: "1:672585065953:web:cb95a1eb3f962faff19ea0",
            measurementId: "G-ENEG3Q96W9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🔥 Firestore offline cache
        try {
            db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
                if (err.code === 'failed-precondition') {
                    console.warn('Firestore persistence: multiple tabs open');
                } else if (err.code === 'unimplemented') {
                    console.warn('Firestore persistence is not supported here');
                } else {
                    console.warn('Firestore persistence error:', err);
                }
            });
        } catch (e) {
            console.warn('Firestore persistence setup error:', e);
        }
        const auth = firebase.auth();

        // ============================================================
        // 📦 SMART CACHE CLASS
        // ============================================================
        class SmartCache {
            constructor() {
                this.ttl = 5 * 60 * 1000; // 5 دقائق
                this.cache = new Map();
            }

            get(key) {
                const item = this.cache.get(key);
                if (!item) return null;
                if (Date.now() - item.timestamp > this.ttl) {
                    this.cache.delete(key);
                    return null;
                }
                return item.data;
            }

            set(key, data) {
                this.cache.set(key, {
                    data: data,
                    timestamp: Date.now()
                });
            }

            getImportant(key) {
                const item = this.cache.get('important_' + key);
                if (!item) return null;
                if (Date.now() - item.timestamp > 30 * 60 * 1000) {
                    this.cache.delete('important_' + key);
                    return null;
                }
                return item.data;
            }

            setImportant(key, data) {
                this.cache.set('important_' + key, {
                    data: data,
                    timestamp: Date.now()
                });
            }

            getFresh(key) {
                const item = this.cache.get('fresh_' + key);
                if (!item) return null;
                if (Date.now() - item.timestamp > 30 * 1000) {
                    this.cache.delete('fresh_' + key);
                    return null;
                }
                return item.data;
            }

            setFresh(key, data) {
                this.cache.set('fresh_' + key, {
                    data: data,
                    timestamp: Date.now()
                });
            }

            clear() {
                this.cache.clear();
            }
        }

        const smartCache = new SmartCache();

        // ============================================================
        // 💾 INDEXEDDB STORAGE
        // ============================================================
        class ChatStorage {
            constructor() {
                this.db = null;
                this.ready = this.init();
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('ChatStorage_V2', 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('messages')) {
                            const store = db.createObjectStore('messages', { keyPath: 'id' });
                            store.createIndex('chatId', 'chatId', { unique: false });
                            store.createIndex('timestamp', 'timestamp', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('chats')) {
                            db.createObjectStore('chats', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = reject;
                });
            }

            async saveMessages(chatId, messages) {
                await this.ready;
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('messages', 'readwrite');
                    const store = tx.objectStore('messages');
                    messages.forEach(msg => {
                        store.put({ ...msg, chatId, savedAt: Date.now() });
                    });
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
            }

            async getMessages(chatId, limit = 50) {
                await this.ready;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('messages', 'readonly');
                    const store = tx.objectStore('messages');
                    const index = store.index('chatId');
                    const request = index.getAll(chatId);
                    request.onsuccess = () => {
                        const results = request.result || [];
                        results.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                        resolve(results.slice(-limit));
                    };
                    request.onerror = () => resolve([]);
                });
            }

            async deleteMessages(chatId) {
                await this.ready;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('messages', 'readwrite');
                    const store = tx.objectStore('messages');
                    const index = store.index('chatId');
                    const request = index.getAll(chatId);
                    request.onsuccess = () => {
                        const results = request.result || [];
                        results.forEach(msg => store.delete(msg.id));
                        tx.oncomplete = resolve;
                    };
                    request.onerror = () => resolve();
                });
            }

            async saveChat(chatId, data) {
                await this.ready;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('chats', 'readwrite');
                    const store = tx.objectStore('chats');
                    store.put({ id: chatId, ...data, savedAt: Date.now() });
                    tx.oncomplete = resolve;
                });
            }

            async getChat(chatId) {
                await this.ready;
                return new Promise((resolve) => {
                    const tx = this.db.transaction('chats', 'readonly');
                    const store = tx.objectStore('chats');
                    const request = store.get(chatId);
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => resolve(null);
                });
            }

            async deleteChat(chatId) {
                await this.ready;
                await this.deleteMessages(chatId);
                return new Promise((resolve) => {
                    const tx = this.db.transaction('chats', 'readwrite');
                    const store = tx.objectStore('chats');
                    store.delete(chatId);
                    tx.oncomplete = resolve;
                });
            }
        }

        const chatStorage = new ChatStorage();

        // ============================================================
        // VARIABLES
        // ============================================================
        let currentChatId = null;
        let currentUserData = null;
        let unsubscribeChats = null;
        let unsubscribeMessages = null;
        let totalReads = 0;
        let searchTimeout = null;
        let lastMessageRef = null;
        let hasMoreMessages = true;
        let isFirstLoad = true;

        // ============================================================

        // ============================================================
        // 🔥 1. PRESENCE SYSTEM
        // ============================================================
        function setAdminPresence() {
            if (!auth.currentUser) return;

        // ============================================================
        // 🔥 2. LOAD CHATS REALTIME
        // ============================================================
        function loadChatsRealtime() {
            if (unsubscribeChats) {
                unsubscribeChats();
                unsubscribeChats = null;
            }

            console.log('📊 [REALTIME] Chats listener started');
            
            unsubscribeChats = db.collection("chats")
                .orderBy("updatedAt", "desc")
                .limit(30)
                .onSnapshot((snapshot) => {
                    console.log('📊 [READ] Chats updated');
                    renderChats(snapshot);
                    updateStats(snapshot);
                    
                    // Preload next chat
                    if (isFirstLoad) {
                        isFirstLoad = false;

                });

        // ============================================================
        // 🔥 3. RENDER CHATS
        // ============================================================
        function renderChats(snapshot) {
            const pendingList = document.getElementById('pending-list');
            const activeList = document.getElementById('active-list');
            const closedList = document.getElementById('closed-list');
            if (!pendingList || !activeList || !closedList) return;

            pendingList.innerHTML = '';
            activeList.innerHTML = '';
            closedList.innerHTML = '';

            let pendingCount = 0, activeCount = 0, closedCount = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const userId = doc.id;
                const status = data.status || 'pending';

                const item = document.createElement('div');
                item.className = `chat-item ${currentChatId === userId ? 'active' : ''}`;
                item.setAttribute('data-user', userId);
                item.onclick = () => openChat(userId);

                const statusBadge = status === 'pending' ? 'pending' : status === 'active' ? 'active' : 'closed';
                const statusLabel = status === 'pending' ? '⏳' : status === 'active' ? '🟢' : '📦';

                const lastMsg = data.lastMessage || 'لا توجد رسائل';
                const time = data.updatedAt?.toDate?.() || new Date();
                const timeStr = time.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                let displayName = data.userName || `مستخدم ${userId.substring(0, 6)}...`;
                let infoText = data.userPhone ? `📱 ${data.userPhone}` : '';
                if (data.userEmail) infoText += (infoText ? ' | ' : '') + `✉️ ${data.userEmail}`;
                if (!infoText) infoText = 'لا توجد معلومات';

                // Presence dot
                const isOnline = data.online === true;
                const presenceHtml = `<span class="presence-dot ${isOnline ? 'online' : 'offline'}"></span>`;

                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="name">${presenceHtml} ${displayName}</div>
                            <span class="user-email">${infoText}</span>
                            <div class="last-msg">${lastMsg}</div>
                        </div>
                        <div class="text-left">
                            <div class="time">${timeStr}</div>
                            <div style="margin-top:2px;"><span class="status-badge ${statusBadge}">${statusLabel}</span></div>
                        </div>
                    </div>
                `;

                if (status === 'pending') { pendingList.appendChild(item); pendingCount++; }
                else if (status === 'active') { activeList.appendChild(item); activeCount++; }
                else { closedList.appendChild(item); closedCount++; }
            });

            document.getElementById('pendingCount').textContent = pendingCount;
            document.getElementById('activeCount').textContent = activeCount;
            document.getElementById('closedCount').textContent = closedCount;
            document.getElementById('pendingCountBadge').textContent = pendingCount;
            document.getElementById('activeCountBadge').textContent = activeCount;
            document.getElementById('closedCountBadge').textContent = closedCount;
        }

        function updateStats(snapshot) {
            let pending = 0, active = 0, closed = 0;
            snapshot.forEach(doc => {
                const status = doc.data().status || 'pending';
                if (status === 'pending') pending++;
                else if (status === 'active') active++;
                else closed++;
            });
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('closedCount').textContent = closed;
            document.getElementById('pendingCountBadge').textContent = pending;
            document.getElementById('activeCountBadge').textContent = active;
            document.getElementById('closedCountBadge').textContent = closed;
        }

        // ============================================================
        // 🔥 4. PRELOAD NEXT CHAT
        // ============================================================
        function preloadNextChat() {
            const visibleItems = document.querySelectorAll('.chat-item:not([style*="display: none"])');
            for (let item of visibleItems) {
                if (!item.classList.contains('active')) {
                    const userId = item.dataset.user;
                    if (userId && userId !== currentChatId) {
                        // تحميل آخر 5 رسائل مسبقاً
                        db.collection("chats").doc(userId)

                            .orderBy('timestamp', 'desc')
                            .limit(5)
                            .get()
                            .then(snapshot => {
                                const messages = [];
                                snapshot.forEach(doc => messages.push({ id: doc.id, ...doc.data() }));
                                messages.reverse();
                                chatStorage.saveMessages(userId, messages);
                                console.log(`📦 [PRELOAD] ${userId} messages ready`);
                            });
                        break;
                    }
                }
            }
        }

        // ============================================================
        // 🔥 5. DEBOUNCED SEARCH
        // ============================================================
        function filterChatsDebounced() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                filterChats();
            }, 300);
        }

        function filterChats() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.chat-item');
            items.forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                const email = item.querySelector('.user-email')?.textContent?.toLowerCase() || '';
                const lastMsg = item.querySelector('.last-msg')?.textContent?.toLowerCase() || '';
                const match = name.includes(searchTerm) || email.includes(searchTerm) || lastMsg.includes(searchTerm);
                item.style.display = match ? '' : 'none';
            });
        }

        // ============================================================
        // 🔥 6. OPEN CHAT
        // ============================================================
        async function openChat(userId) {
            if (currentChatId === userId) return;

            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }

            currentChatId = userId;
            const chatData = await chatStorage.getChat(userId) || {};

            // Try to get fresh data from cache
            const cachedChat = smartCache.getImportant('chat_' + userId);
            const finalData = cachedChat || chatData;

            currentUserData = {
                username: finalData.userName || `مستخدم ${userId.substring(0, 6)}...`,
                phone: finalData.userPhone || 'لا يوجد رقم',
                email: finalData.userEmail || 'لا يوجد بريد'
            };

            document.getElementById('chatSub').innerHTML = `
                <span class="user-info">👤 ${currentUserData.username}</span> |
                <span class="user-info">📱 ${currentUserData.phone}</span> |
                <span class="user-info">✉️ ${currentUserData.email}</span>
            `;

            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.chat-item[data-user="${userId}"]`)?.classList.add('active');

            document.getElementById('chatTitle').textContent = '🟢 محادثة مع المستخدم';
            document.getElementById('chatActions').style.display = 'flex';
            document.getElementById('chatInput').style.display = 'flex';
            document.getElementById('adminInput').disabled = false;
            document.getElementById('adminInput').focus();
            document.getElementById('quickKeyboard').classList.add('show');

            // Update status to active if pending
            if (finalData.status === 'pending') {
                try {
                    await db.collection("chats").doc(userId).set({
                        status: 'active',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    await db.collection("chats").doc(userId).collection("messages").add({
                        text: 'انضم أحد أعضاء فريق الدعم إلى المحادثة',
                        sender: 'system',
                        type: 'admin_join',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast('🟢 انضممت إلى المحادثة', 'success');
                } catch (err) {
                    console.error("Chat status update error:", err);
                }
            }

            // 📦 Load from IndexedDB first
            let cachedMessages = await chatStorage.getMessages(userId, 50);
            if (cachedMessages.length) {
                renderMessages(cachedMessages);
                console.log('📦 [INDEXEDDB] Rendered', cachedMessages.length, 'messages');
            } else {
                // Fallback to localStorage
                cachedMessages = getMessageCache(userId);
                if (cachedMessages.length) {
                    renderMessages(cachedMessages);
                    chatStorage.saveMessages(userId, cachedMessages);
                } else {
                    document.getElementById('messages-area').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <h3>جاري تحميل الرسائل</h3>
                            <p>أول مرة فقط من Firestore</p>
                        </div>
                    `;
                }
            }

            // 🔥 Listen for NEW messages only
            let query = db.collection("chats")
                .doc(userId)
                .collection("messages")
                .orderBy('timestamp', 'asc');

            const lastCached = cachedMessages[cachedMessages.length - 1];
            if (lastCached?.timestamp) {
                const lastDate = new Date(lastCached.timestamp);
                if (!isNaN(lastDate.getTime())) {
                    query = query.startAfter(firebase.firestore.Timestamp.fromDate(lastDate));
                }
            } else {
                query = query.limitToLast(30);
            }

            console.log('📊 [REALTIME] Messages listener started');

            unsubscribeMessages = query.onSnapshot(async (snapshot) => {
                if (snapshot.empty) {
                    if (!cachedMessages.length) {
                        renderMessages([]);
                    }
                    return;
                }

                const incoming = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    incoming.push({
                        id: doc.id,
                        ...data,
                        timestamp: data.timestamp?.toDate?.() || new Date()
                    });
                });

                // Merge with existing
                const merged = mergeMessages(cachedMessages, incoming);
                await chatStorage.saveMessages(userId, merged);
                saveMessageCache(userId, merged);
                renderMessages(merged);
                cachedMessages = merged;

                console.log('📊 [READ] New messages:', incoming.length, '| Total:', merged.length);
            }, (error) => {
                console.error("Messages listener error:", error);
                showToast('⚠️ خطأ في تحميل الرسائل', 'error');
            });

            // Save chat data to cache
            smartCache.setImportant('chat_' + userId, finalData);
            chatStorage.saveChat(userId, finalData);

            // Preload next chat
            setTimeout(preloadNextChat, 500);
        }

        // ============================================================
        // 🔥 7. MERGE MESSAGES
        // ============================================================
        function mergeMessages(existing, incoming) {
            const map = new Map(existing.map(m => [m.id, m]));
            incoming.forEach(m => map.set(m.id, m));
            return Array.from(map.values()).sort((a, b) => 
                new Date(a.timestamp) - new Date(b.timestamp)
            );
        }

        // ============================================================
        // 💾 MESSAGE CACHE HELPERS
        // ============================================================
        function getMessageCache(chatId) {
            try {
                const raw = localStorage.getItem('nolx_admin_messages_' + chatId);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return parsed.map(m => ({
                    ...m,
                    timestamp: m.timestamp ? new Date(m.timestamp) : new Date()
                }));
            } catch (e) { return []; }
        }

        function saveMessageCache(chatId, messages) {
            try {
                const compact = messages.map(m => ({
                    id: m.id,
                    text: m.text || '',
                    sender: m.sender || 'system',
                    type: m.type || '',
                    timestamp: m.timestamp instanceof Date ? m.timestamp.toISOString() : m.timestamp
                }));
                localStorage.setItem('nolx_admin_messages_' + chatId, JSON.stringify(compact));
            } catch (e) { console.warn('Cache write error:', e); }
        }

        // ============================================================
        // 🔥 8. RENDER MESSAGES
        // ============================================================
        function renderMessages(messages) {
            const container = document.getElementById('messages-area');
            container.innerHTML = '';

            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment"></i>
                        <h3>لا توجد رسائل</h3>
                        <p>كن أول من يراسل</p>
                    </div>
                `;
                return;
            }

            messages.forEach((msg) => {
                const isUser = msg.sender === 'user';
                const isAdmin = msg.sender === 'admin';
                const isSystem = msg.sender === 'system';
                const isAdminJoin = msg.type === 'admin_join';
                const isAutoReply = msg.type === 'auto_reply';

                const div = document.createElement('div');
                div.className = `flex ${isUser ? 'justify-end' : isSystem || isAdminJoin || isAutoReply ? 'justify-center' : 'justify-start'} mb-2`;

                if (isAdminJoin) {
                    div.innerHTML = `
                        <div class="admin-join-card">
                            <div class="icon"><i class="fas fa-user-shield"></i></div>
                            <div class="info">
                                <div class="name">🟢 فريق الدعم</div>
                                <div class="status"><span class="dot"></span> انضم إلى المحادثة</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                    return;
                }

                if (isSystem || isAutoReply) {
                    const icon = isAutoReply ? 'fas fa-reply' : 'fas fa-info-circle';
                    div.innerHTML = `
                        <div class="msg-system">
                            <i class="${icon} ml-1"></i> ${msg.text}
                        </div>
                    `;
                    container.appendChild(div);
                    return;
                }

                const bubble = document.createElement('div');
                bubble.className = isUser ? 'msg-user' : 'msg-admin';
                
                let badge = '';
                if (isAdmin) {
                    badge = `<div class="message-badge"><i class="fas fa-user-shield ml-1"></i> فريق الدعم</div>`;
                }
                
                const time = msg.timestamp || new Date();
                const timeStr = time.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                
                bubble.innerHTML = `
                    ${badge}
                    ${msg.text}
                    <span class="msg-time">${timeStr}</span>
                `;
                
                div.appendChild(bubble);
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // 🔥 9. SEND ADMIN MESSAGE (مع Batch Writes)
        // ============================================================
        async function sendAdminMessage() {
            const input = document.getElementById('adminInput');
            const text = input.value.trim();
            if (!text || !currentChatId) {
                if (!text) showToast('⚠️ الرجاء كتابة رسالة', 'warning');
                return;
            }

            // 🎯 Optimistic Update
            const tempId = 'temp_' + Date.now();
            const tempMessage = {
                id: tempId,
                text: text,
                sender: 'admin',
                timestamp: new Date(),
                isTemp: true
            };

            const cached = await chatStorage.getMessages(currentChatId) || [];
            cached.push(tempMessage);
            await chatStorage.saveMessages(currentChatId, cached);
            renderMessages(cached);

            input.value = '';
            input.focus();

            try {
                // 📦 Batch write
                const batch = db.batch();
                const chatRef = db.collection("chats").doc(currentChatId);
                
                const msgRef = chatRef.collection("messages").doc();
                batch.set(msgRef, {
                    text: text,
                    sender: 'admin',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                batch.update(chatRef, {
                    lastMessage: text,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await batch.commit();

                // Replace temp message with real one
                const realMessages = await chatStorage.getMessages(currentChatId) || [];
                const index = realMessages.findIndex(m => m.id === tempId);
                if (index !== -1) {
                    realMessages[index] = { ...realMessages[index], id: msgRef.id, isTemp: false };
                    await chatStorage.saveMessages(currentChatId, realMessages);
                    saveMessageCache(currentChatId, realMessages);
                    renderMessages(realMessages);
                }

                showToast('✅ تم إرسال الرسالة', 'success');
            } catch (error) {
                console.error("Send error:", error);
                // Remove temp message
                const realMessages = await chatStorage.getMessages(currentChatId) || [];
                const filtered = realMessages.filter(m => m.id !== tempId);
                await chatStorage.saveMessages(currentChatId, filtered);
                renderMessages(filtered);
                showToast('❌ حدث خطأ أثناء الإرسال', 'error');
            }
        }

        // ============================================================
        // 🔥 10. CLOSE CHAT
        // ============================================================
        async function closeChat() {
            if (!currentChatId || !confirm('⚠️ هل تريد إنهاء هذه المحادثة؟')) return;
            try {
                await db.collection("chats").doc(currentChatId).collection("messages").add({
                    text: '🔴 تم إنهاء المحادثة بواسطة فريق الدعم',
                    sender: 'system',
                    type: 'admin_close',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                await db.collection("chats").doc(currentChatId).set({
                    status: 'closed',
                    closedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    closedReason: 'admin',
                    closedBy: 'admin'
                }, { merge: true });
                
                // Clear cache
                await chatStorage.deleteChat(currentChatId);
                try { localStorage.removeItem('nolx_admin_messages_' + currentChatId); } catch (e) {}
                
                resetChatView();
                showToast('✅ تم إنهاء المحادثة بنجاح', 'success');
            } catch (error) {
                console.error("Close error:", error);
                showToast('❌ حدث خطأ أثناء إنهاء المحادثة', 'error');
            }
        }

        // ============================================================
        // 🔥 11. DELETE CHAT
        // ============================================================
        async function deleteChat() {
            if (!currentChatId || !confirm('⚠️ هل تريد حذف هذه المحادثة نهائياً؟')) return;
            try {
                const messages = await db.collection("chats").doc(currentChatId).collection("messages").get();
                const batch = db.batch();
                messages.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                await db.collection("chats").doc(currentChatId).delete();
                
                await chatStorage.deleteChat(currentChatId);
                try { localStorage.removeItem('nolx_admin_messages_' + currentChatId); } catch (e) {}
                
                resetChatView();
                showToast('🗑️ تم حذف المحادثة نهائياً', 'error');
            } catch (error) {
                console.error("Delete error:", error);
                showToast('❌ حدث خطأ أثناء الحذف', 'error');
            }
        }

        // 🔥 12. REFRESH
        // ============================================================
        function refreshChat() {
            if (!currentChatId) return;
            const id = currentChatId;
            showToast('🔄 جاري فحص الرسائل الجديدة...', 'info');

        // ============================================================
        // 🔥 13. CONVERT TO TICKET
        // ============================================================
        async function convertToTicket() {
            if (!currentChatId || !confirm('📌 هل تريد تحويل هذه المحادثة إلى تذكرة دعم؟')) return;
            try {
                const messages = await db.collection("chats").doc(currentChatId).collection("messages")
                    .orderBy('timestamp', 'asc').get();
                let messagesText = '';
                messages.forEach((doc) => {
                    const msg = doc.data();
                    const sender = msg.sender === 'user' ? 'المستخدم' :
                        msg.sender === 'admin' ? 'فريق الدعم' : 'النظام';
                    messagesText += `[${sender}] ${msg.text || ''}\n`;
                });
                await db.collection("tickets").add({
                    chatId: currentChatId,
                    messages: messagesText,
                    status: 'open',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    userId: currentChatId,
                    userName: currentUserData?.username || '',
                    userEmail: currentUserData?.email || '',
                    userPhone: currentUserData?.phone || ''
                });
                showToast('✅ تم تحويل المحادثة إلى تذكرة بنجاح', 'success');
            } catch (error) {
                console.error("Ticket error:", error);
                showToast('❌ حدث خطأ أثناء التحويل للتذكرة', 'error');
            }
        }

        // ============================================================
        // 🔥 14. INIT
        // ============================================================
        const quickPhrases = ['أهلاً بيك', 'أقدر أساعد حضرتك؟', 'لحظات معايا', 'تم الحل', 'شكراً لتواصلك'];
        const grid = document.getElementById('keyboardGrid');
        quickPhrases.forEach(phrase => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.textContent = phrase;
            btn.onclick = () => {
                document.getElementById('adminInput').value = phrase;
                document.getElementById('adminInput').focus();
            };
            grid.appendChild(btn);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.activeElement?.id === 'adminInput') {
                e.preventDefault();
                sendAdminMessage();
            }
            if (e.key === 'Escape' && currentChatId) {
                e.preventDefault();
                resetChatView();
                showToast('📤 تم الخروج من المحادثة', 'info');
            }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                setAdminPresence();
                loadChatsRealtime();
                console.log('✅ Admin panel ready! (Optimized)');
            }
        });

        console.log('🔥 [OPTIMIZED] Admin panel with all enhancements!');
        console.log('💾 Smart Cache + IndexedDB + Batch Writes + Prefetch');
    </script>
