<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOLX | الدعم الفني</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nolxGreen: "#005840",
                        nolxDark: "#003d2d",
                        nolxLime: "#D1F843",
                        nolxBg: "#e9efed"
                    }
                }
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(209, 249, 67, 0.20), transparent 28%),
                radial-gradient(circle at 90% 15%, rgba(0, 88, 64, 0.12), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(0, 88, 64, 0.10), transparent 35%),
                #e9efed;
            overflow-x: hidden;
        }

        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.38));
            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 35px 100px rgba(0, 61, 45, 0.13);
        }

        .blob {
            position: fixed;
            border-radius: 999px;
            filter: blur(70px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }
        .blob-one {
            width: 300px;
            height: 300px;
            background: #D1F843;
            top: -100px;
            left: -100px;
        }
        .blob-two {
            width: 350px;
            height: 350px;
            background: #005840;
            right: -150px;
            bottom: -150px;
        }

        .chat-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 20px auto;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            border-radius: 32px;
            overflow: hidden;
        }

        /* ===== BUBBLES ===== */
        .message-bubble-user {
            background: linear-gradient(135deg, #005840, #003d2d);
            color: #D1F843;
            border-radius: 18px 18px 0 18px;
            padding: 12px 18px;
            max-width: 80%;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 88, 64, 0.15);
        }

        .message-bubble-admin {
            background: rgba(255, 255, 255, 0.85);
            color: #005840;
            border-radius: 18px 18px 18px 0;
            padding: 12px 18px;
            max-width: 80%;
            word-wrap: break-word;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .message-bubble-system {
            background: rgba(209, 249, 67, 0.15);
            color: #005840;
            border-radius: 99px;
            padding: 6px 18px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            max-width: 80%;
            margin: 8px auto;
            border: 1px dashed rgba(0, 88, 64, 0.15);
        }

        /* ===== ADMIN JOIN CARD ===== */
        .admin-join-card {
            background: linear-gradient(135deg, rgba(0, 88, 64, 0.06), rgba(209, 249, 67, 0.06));
            border: 2px solid rgba(0, 88, 64, 0.12);
            border-radius: 18px;
            padding: 14px 20px;
            max-width: 85%;
            margin: 8px auto;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            animation: adminJoinAnim 0.6s ease;
            backdrop-filter: blur(5px);
        }

        .admin-join-card .admin-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #005840, #003d2d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D1F843;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 88, 64, 0.15);
        }

        .admin-join-card .admin-info {
            text-align: right;
        }
        .admin-join-card .admin-info .name {
            font-weight: 900;
            color: #005840;
            font-size: 14px;
        }
        .admin-join-card .admin-info .status {
            font-size: 11px;
            color: rgba(0, 88, 64, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .admin-join-card .admin-info .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes adminJoinAnim {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ===== BADGE ===== */
        .message-badge {
            display: inline-block;
            background: rgba(0, 88, 64, 0.06);
            border: 1px solid rgba(0, 88, 64, 0.06);
            border-radius: 99px;
            padding: 2px 12px;
            font-size: 9px;
            color: rgba(0, 88, 64, 0.3);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 9px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
        }

        /* ===== INPUTS ===== */
        .input-field {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 88, 64, 0.12);
            border-radius: 18px;
            padding: 12px 20px;
            color: #005840;
            font-family: "Cairo", sans-serif;
            outline: none;
            transition: 0.3s;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #005840;
            box-shadow: 0 0 0 4px rgba(0, 88, 64, 0.07);
        }
        .input-field::placeholder {
            color: rgba(0, 88, 64, 0.35);
        }
        .input-field:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-btn {
            background: linear-gradient(135deg, #005840, #003d2d);
            color: #D1F843;
            border: none;
            border-radius: 18px;
            padding: 12px 24px;
            font-weight: 800;
            font-family: "Cairo", sans-serif;
            cursor: pointer;
            transition: 0.3s;
            min-width: 100px;
        }
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 88, 64, 0.2);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== STATUS ===== */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .status-dot.connected {
            background: #22c55e;
        }
        .status-dot.connecting {
            background: #eab308;
        }
        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }
        .status-dot.admin-online {
            background: #005840;
        }

        /* ===== CONTAINERS ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scroll-behavior: smooth;
        }
        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(0, 88, 64, 0.2);
            border-radius: 99px;
        }

        .chat-footer {
            padding: 16px 24px 24px;
            gap: 12px;
        }

        .header-title {
            font-weight: 900;
            color: #005840;
            letter-spacing: 0.05em;
        }
        .header-sub {
            color: rgba(0, 88, 64, 0.5);
            font-size: 11px;
            font-weight: 700;
        }

        /* ===== QUICK REPLIES ===== */
        .quick-reply {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 88, 64, 0.08);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 12px;
            color: #005840;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 0 auto;
            min-width: 45%;
        }
        .quick-reply:hover {
            background: rgba(0, 88, 64, 0.08);
            transform: translateY(-1px);
        }
        .quick-reply i {
            font-size: 14px;
            color: #005840;
            opacity: 0.5;
        }

        .quick-replies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 16px 4px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            color: rgba(0, 88, 64, 0.3);
            margin-top: 35%;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-weight: 900;
            color: rgba(0, 88, 64, 0.4);
            font-size: 18px;
        }
        .empty-state p {
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== OFFLINE FORM ===== */
        .offline-form {
            display: none;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            margin: 10px 16px;
        }
        .offline-form.show {
            display: block;
        }
        .offline-form input,
        .offline-form textarea {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 88, 64, 0.12);
            background: rgba(255, 255, 255, 0.8);
            font-family: "Cairo", sans-serif;
            outline: none;
            margin-bottom: 10px;
            color: #005840;
        }
        .offline-form input:focus,
        .offline-form textarea:focus {
            border-color: #005840;
            box-shadow: 0 0 0 4px rgba(0, 88, 64, 0.07);
        }
        .offline-form textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* ===== RATING MODAL ===== */
        .rating-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .rating-modal.show {
            display: flex;
        }
        .rating-modal .modal-content {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .rating-modal h3 {
            color: #005840;
            font-weight: 900;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .rating-modal p {
            color: rgba(0, 88, 64, 0.5);
            font-size: 13px;
            margin-bottom: 16px;
        }

        /* ===== STARS RATING ===== */
        .star-rating {
            display: flex;
            gap: 8px;
            justify-content: center;
            direction: ltr;
        }
        .star-rating i {
            font-size: 32px;
            color: #d1d5db;
            cursor: pointer;
            transition: 0.2s;
        }
        .star-rating i:hover,
        .star-rating i.active {
            color: #f59e0b;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width: 640px) {
            .chat-container {
                margin: 0;
                height: 100vh;
                border-radius: 0;
            }
            .messages-container {
                padding: 16px;
            }
            .chat-footer {
                padding: 12px 16px 16px;
            }
            .send-btn {
                min-width: 70px;
                padding: 12px 16px;
                font-size: 13px;
            }
            .input-field {
                font-size: 14px;
                padding: 10px 16px;
            }
            .rating-modal .modal-content {
                padding: 24px;
            }
            .admin-join-card {
                padding: 12px 16px;
                gap: 10px;
            }
            .admin-join-card .admin-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .admin-join-card .admin-info .name {
                font-size: 13px;
            }
            .offline-form {
                margin: 10px 12px;
                padding: 16px;
            }
            .quick-reply {
                font-size: 11px;
                padding: 6px 12px;
                min-width: 42%;
            }
            .quick-reply i {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>

    <!-- ===== RATING MODAL ===== -->
    <div id="ratingModal" class="rating-modal">
        <div class="modal-content">
            <i class="fas fa-smile" style="font-size: 48px; color: #f59e0b; margin-bottom: 12px;"></i>
            <h3>كيف تقيم تجربتك؟</h3>
            <p>ساعدنا في تحسين الخدمة بتقييمك</p>
            <div class="star-rating" id="starRating">
                <i class="fas fa-star" data-value="1" onclick="rateChat(1)"></i>
                <i class="fas fa-star" data-value="2" onclick="rateChat(2)"></i>
                <i class="fas fa-star" data-value="3" onclick="rateChat(3)"></i>
                <i class="fas fa-star" data-value="4" onclick="rateChat(4)"></i>
                <i class="fas fa-star" data-value="5" onclick="rateChat(5)"></i>
            </div>
            <button onclick="closeRating()" class="mt-4 text-[#005840]/50 hover:text-[#005840] text-sm font-bold">تخطي</button>
        </div>
    </div>

    <!-- ===== CHAT CONTAINER ===== -->
    <div class="chat-container glass">

        <!-- ===== HEADER ===== -->
        <div class="p-4 border-b border-[#005840]/10 flex items-center justify-between">
            <div>
                <div class="header-title text-lg flex items-center gap-2">
                    <i class="fas fa-headset" style="color: #005840;"></i>
                    <span>الدعم الفني</span>
                </div>
                <div class="header-sub flex items-center gap-2 mt-0.5">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">جاري الاتصال...</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='index.html'" class="text-[#005840]/40 hover:text-[#005840] transition text-sm">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <button onclick="resetChat()" class="text-[#005840]/30 hover:text-red-500 transition text-sm" title="بدء محادثة جديدة">
                    <i class="fas fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- ===== MESSAGES ===== -->
        <div id="messages-container" class="messages-container">
            <div class="empty-state">
                <i class="fas fa-comment-dots"></i>
                <h3>مرحباً بك!</h3>
                <p>اكتب رسالتك وسيرد عليك الدعم قريباً.</p>
            </div>
        </div>

        <!-- ===== OFFLINE FORM ===== -->
        <div id="offlineForm" class="offline-form">
            <h4 class="font-bold text-[#005840] mb-2">📩 سنرد عليك خلال 24 ساعة</h4>
            <p class="text-xs text-[#005840]/50 mb-3">الدعم غير متاح حالياً. اترك رسالتك وسنرد عليك قريباً.</p>
            <input id="offlineName" type="text" placeholder="الاسم (اختياري)">
            <input id="offlineEmail" type="email" placeholder="البريد الإلكتروني (للمتابعة)">
            <textarea id="offlineMessage" placeholder="رسالتك..."></textarea>
            <button onclick="sendOfflineMessage()" class="send-btn w-full">إرسال</button>
        </div>

        <!-- ===== QUICK REPLIES - اقتراحات المشاكل ===== -->
        <div class="quick-replies-grid">
            <button class="quick-reply" onclick="quickReply('مرحباً، عندي مشكلة في تسجيل الدخول')">
                <i class="fas fa-sign-in-alt"></i> مشكلة في الدخول
            </button>
            <button class="quick-reply" onclick="quickReply('لم أستلم رابط إعادة تعيين كلمة المرور')">
                <i class="fas fa-key"></i> نسيت كلمة المرور
            </button>
            <button class="quick-reply" onclick="quickReply('مشكلة في عملية الدفع، تم خصم المبلغ ولم تكتمل')">
                <i class="fas fa-credit-card"></i> مشكلة في الدفع
            </button>
            <button class="quick-reply" onclick="quickReply('الموقع بطيء أو لا يعمل بشكل جيد')">
                <i class="fas fa-globe"></i> مشكلة في الموقع
            </button>
            <button class="quick-reply" onclick="quickReply('أريد معلومات عن الخدمات المتاحة')">
                <i class="fas fa-info-circle"></i> استفسار عن الخدمة
            </button>
            <button class="quick-reply" onclick="quickReply('لدي شكوى أو اقتراح للتطوير')">
                <i class="fas fa-comment"></i> شكوى أو اقتراح
            </button>
            <button class="quick-reply" onclick="quickReply('أريد تعديل بياناتي الشخصية')">
                <i class="fas fa-user-edit"></i> تحديث بياناتي
            </button>
            <button class="quick-reply" onclick="quickReply('أريد حذف حسابي نهائياً')">
                <i class="fas fa-user-slash"></i> طلب حذف حساب
            </button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="chat-footer">
            <div class="flex gap-2">
                <input id="message-input" type="text" placeholder="اكتب رسالتك هنا..." class="input-field flex-1">
                <button id="sendBtn" onclick="sendMessage()" class="send-btn">
                    <i class="fas fa-paper-plane ml-1"></i> إرسال
                </button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // FIREBASE CONFIG
        // =====================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBbpP6uttRj_7LozBvtPRw7QtHzBfr72CU",
            authDomain: "nolxpages.firebaseapp.com",
            projectId: "nolxpages",
            storageBucket: "nolxpages.firebasestorage.app",
            messagingSenderId: "672585065953",
            appId: "1:672585065953:web:cb95a1eb3f962faff19ea0",
            measurementId: "G-ENEG3Q96W9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // =====================================================
        // GLOBAL VARIABLES
        // =====================================================
        let userId = "";
        let isSending = false;
        let chatStatus = "pending";
        let isAdminOnline = false;

        // =====================================================
        // DOM ELEMENTS
        // =====================================================
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const offlineForm = document.getElementById('offlineForm');
        const ratingModal = document.getElementById('ratingModal');

        // =====================================================
        // AUTH - تسجيل دخول مجهول
        // =====================================================
        auth.signInAnonymously()
            .then((userCredential) => {
                userId = userCredential.user.uid;
                setStatus('connecting', 'جاري الاتصال...');
                checkAdminStatus();
                loadMessages();
                loadChatStatus();
            })
            .catch((error) => {
                console.error("[NOLX] Auth error:", error);
                setStatus('disconnected', 'غير متصل');
            });

        // =====================================================
        // STATUS
        // =====================================================
        function setStatus(type, text) {
            statusDot.className = `status-dot ${type}`;
            statusText.textContent = text;
        }

        // =====================================================
        // CHECK ADMIN STATUS - هل الأدمن متصل؟
        // =====================================================
        function checkAdminStatus() {
            db.collection("adminStatus").doc("online")
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        isAdminOnline = doc.data().online || false;
                        if (isAdminOnline) {
                            setStatus('admin-online', 'أدمن متصل ✅');
                            offlineForm.classList.remove('show');
                            messageInput.disabled = false;
                            sendBtn.disabled = false;
                        } else {
                            setStatus('connecting', 'في انتظار الأدمن...');
                            offlineForm.classList.add('show');
                            messageInput.disabled = true;
                            sendBtn.disabled = true;
                        }
                    }
                });
        }

        // =====================================================
        // LOAD CHAT STATUS - متابعة حالة المحادثة
        // =====================================================
        function loadChatStatus() {
            db.collection("chats").doc(userId)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        chatStatus = data.status || "pending";
                        if (chatStatus === "closed") {
                            showRating();
                        }
                    }
                });
        }

        // =====================================================
        // LOAD MESSAGES - عرض الرسائل
        // =====================================================
        function loadMessages() {
            db.collection("chats").doc(userId).collection("messages")
                .orderBy("timestamp", "asc")
                .onSnapshot((snapshot) => {
                    messagesContainer.innerHTML = "";

                    if (snapshot.empty) {
                        messagesContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-comment-dots"></i>
                                <h3>مرحباً بك!</h3>
                                <p>اكتب رسالتك وسيرد عليك الدعم قريباً.</p>
                            </div>
                        `;
                        return;
                    }

                    snapshot.forEach((doc) => {
                        const msg = doc.data();
                        const isUser = msg.sender === "user";
                        const isSystem = msg.sender === "system";
                        const isAdmin = msg.sender === "admin";
                        const isAdminJoin = msg.type === "admin_join";

                        const div = document.createElement("div");

                        // ===== رسالة انضمام الأدمن (كارت احترافي) =====
                        if (isAdminJoin) {
                            div.className = 'flex justify-center my-2';
                            div.innerHTML = `
                                <div class="admin-join-card">
                                    <div class="admin-icon">
                                        <i class="fas fa-user-shield"></i>
                                    </div>
                                    <div class="admin-info">
                                        <div class="name">🟢 الدعم الفني</div>
                                        <div class="status">
                                            <span class="dot"></span>
                                            انضم إلى المحادثة
                                        </div>
                                    </div>
                                </div>
                            `;
                            messagesContainer.appendChild(div);
                            return;
                        }

                        // ===== رسائل النظام =====
                        if (isSystem) {
                            div.className = 'flex justify-center my-1';
                            div.innerHTML = `
                                <div class="message-bubble-system">
                                    <i class="fas fa-info-circle ml-1"></i> ${msg.text}
                                </div>
                            `;
                            messagesContainer.appendChild(div);
                            return;
                        }

                        // ===== رسائل المستخدم والأدمن =====
                        div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-2`;
                        const bubble = document.createElement("div");
                        bubble.className = isUser ? 'message-bubble-user' : 'message-bubble-admin';

                        // إضافة badge للأدمن
                        let badgeHtml = '';
                        if (isAdmin) {
                            badgeHtml = `<div class="message-badge"><i class="fas fa-user-shield ml-1"></i> دعم فني</div>`;
                        }

                        const time = msg.timestamp?.toDate?.() || new Date();
                        const timeStr = time.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                        bubble.innerHTML = `
                            ${badgeHtml}
                            ${msg.text}
                            <span class="message-time">${timeStr}</span>
                        `;
                        div.appendChild(bubble);
                        messagesContainer.appendChild(div);
                    });

                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
        }

        // =====================================================
        // SEND MESSAGE - إرسال رسالة من المستخدم
        // =====================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            if (!userId || isSending) return;

            isSending = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري...';

            try {
                await db.collection("chats").doc(userId).collection("messages").add({
                    text: text,
                    sender: "user",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                await db.collection("chats").doc(userId).set({
                    status: "pending",
                    lastMessage: text,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                messageInput.value = "";
                messageInput.focus();

            } catch (error) {
                console.error("[NOLX] Send error:", error);
                alert('حدث خطأ أثناء إرسال الرسالة. حاول مرة أخرى.');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane ml-1"></i> إرسال';
            }
        }

        // =====================================================
        // QUICK REPLY - ردود سريعة (اقتراحات المشاكل)
        // =====================================================
        function quickReply(text) {
            messageInput.value = text;
            messageInput.focus();
            sendMessage();
        }

        // =====================================================
        // RESET CHAT - إعادة تعيين المحادثة
        // =====================================================
        function resetChat() {
            if (confirm('هل تريد بدء محادثة جديدة؟ سيتم مسح الرسائل الحالية.')) {
                db.collection("chats").doc(userId).collection("messages")
                    .get()
                    .then((snapshot) => {
                        const batch = db.batch();
                        snapshot.forEach((doc) => batch.delete(doc.ref));
                        return batch.commit();
                    })
                    .then(() => {
                        return db.collection("chats").doc(userId).set({
                            status: "pending",
                            lastMessage: "",
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                    })
                    .then(() => {
                        messagesContainer.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-comment-dots"></i>
                                <h3>تم بدء محادثة جديدة</h3>
                                <p>اكتب رسالتك وسيرد عليك الدعم قريباً.</p>
                            </div>
                        `;
                    })
                    .catch((error) => console.error("[NOLX] Reset error:", error));
            }
        }

        // =====================================================
        // OFFLINE MESSAGE - رسالة خارج أوقات العمل
        // =====================================================
        async function sendOfflineMessage() {
            const name = document.getElementById('offlineName').value.trim() || 'مجهول';
            const email = document.getElementById('offlineEmail').value.trim();
            const message = document.getElementById('offlineMessage').value.trim();
            if (!message) return alert('الرجاء كتابة رسالتك');

            try {
                await db.collection("offlineMessages").add({
                    name: name,
                    email: email,
                    message: message,
                    userId: userId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('✅ تم استلام رسالتك! سنرد عليك خلال 24 ساعة.');
                document.getElementById('offlineMessage').value = '';
                document.getElementById('offlineName').value = '';
                document.getElementById('offlineEmail').value = '';
            } catch (error) {
                console.error("[NOLX] Offline error:", error);
                alert('حدث خطأ. حاول مرة أخرى.');
            }
        }

        // =====================================================
        // RATING - تقييم المحادثة
        // =====================================================
        function showRating() {
            ratingModal.classList.add('show');
        }

        function closeRating() {
            ratingModal.classList.remove('show');
        }

        function rateChat(value) {
            const stars = document.querySelectorAll('.star-rating i');
            stars.forEach((star, index) => {
                if (index < value) star.classList.add('active');
                else star.classList.remove('active');
            });

            db.collection("chats").doc(userId).set({
                rating: value,
                ratingDate: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            setTimeout(() => {
                closeRating();
            }, 1000);
        }

        // =====================================================
        // ENTER KEY - إرسال بالضغط على Enter
        // =====================================================
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // =====================================================
        // AUTO FOCUS
        // =====================================================
        messageInput.focus();

        console.log("[NOLX] Chat page initialized.");
    </script>

</body>
</html>
